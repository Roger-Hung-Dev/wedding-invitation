<footer
  class="footer"
  appScrollReveal
  [staggerSelector]="'.anim-fade-up, .anim-fade-in'"
  [staggerMs]="100"
>
  <h2 class="footer__title anim-fade-up">{{ text.title }}</h2>

  <div class="footer__body anim-fade-up">
    @for (line of text.bodyLines; track line) {
      <p>{{ line }}</p>
    }
  </div>

  <div class="footer__monogram anim-fade-in">
    <span>{{ content.monogram }}</span>
  </div>

  <p class="footer__date anim-fade-in">{{ weddingDateDisplay }}</p>

  <p class="footer__copyright anim-fade-in">{{ text.copyright }}</p>
</footer>
