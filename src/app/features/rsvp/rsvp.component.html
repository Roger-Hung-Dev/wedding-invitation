<section
  class="rsvp"
  appScrollReveal
  [staggerSelector]="'.anim-fade-up, .anim-fade-in'"
  [staggerMs]="90"
>
  <app-corner-emboss top="ivory" bottom="blush" />
  <app-section-heading [eyebrow]="text.eyebrow" [title]="text.title" />

  <div class="rsvp__intro anim-fade-up">
    @for (line of introLines(); track line) {
      <p>{{ line }}</p>
    }
  </div>

  <div class="rsvp__card anim-fade-up">
    <div class="rsvp__chips">
      @for (chip of diet.fieldChips(); track chip) {
        <span class="rsvp__chip">{{ chip }}</span>
      }
    </div>

    <a class="rsvp__cta" [href]="diet.rsvpFormUrl()" target="_blank" rel="noopener">
      <span>{{ text.ctaLabel }}</span>
      <app-icon name="external-link" [size]="16" color="var(--color-text-invert)" />
    </a>

    <p class="rsvp__note">{{ text.ctaNote }}</p>
  </div>
</section>
