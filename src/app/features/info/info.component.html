<section
  class="info"
  appScrollReveal
  [staggerSelector]="'.anim-fade-up, .anim-fade-in'"
  [staggerMs]="90"
>
  <app-section-heading [title]="text.title" titleFont="serif" />

  <div class="info__layout anim-fade-up">
    <figure class="info__parking">
      <a class="info__parking-link" [href]="text.parkingMapUrl" target="_blank" rel="noopener">
        <img
          class="info__parking-img"
          [src]="text.parkingMapUrl"
          [alt]="text.parkingMapAlt"
          width="1200"
          height="1110"
          loading="lazy"
          decoding="async"
        />
      </a>
      <figcaption class="info__parking-hint">
        <app-icon name="external-link" [size]="14" color="var(--color-text-muted)" />
        <span>{{ text.parkingMapZoomHint }}</span>
      </figcaption>
    </figure>

    <div class="info__map-block">
      <div class="info__map-preview">
        <iframe
          class="info__map-frame"
          [src]="mapEmbedUrl"
          [title]="text.mapFrameTitle"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
      <a class="info__nav-btn" [href]="mapsUrl" target="_blank" rel="noopener">
        <app-icon name="navigation" [size]="16" color="var(--color-text-invert)" />
        <span>{{ text.navButtonLabel }}</span>
      </a>
    </div>
  </div>

</section>
