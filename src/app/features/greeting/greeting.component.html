<section
  class="greeting"
  appScrollReveal
  [staggerSelector]="'.anim-fade-up, .anim-fade-in'"
  [staggerMs]="160"
>
  <picture class="webp-picture">
    <source type="image/webp" [attr.srcset]="text.photoMobileUrl | webpSrcset" sizes="100vw" />
    <img
      class="greeting__photo greeting__photo--mobile anim-fade-in"
      [src]="text.photoMobileUrl"
      [alt]="text.photoMobileAlt"
      width="1000"
      height="1500"
      loading="lazy"
      decoding="async"
    />
  </picture>
  <picture class="webp-picture">
    <source type="image/webp" [attr.srcset]="text.photoDesktopUrl | webpSrcset" sizes="min(66vw, 105vh)" />
    <img
      class="greeting__photo greeting__photo--desktop anim-fade-in"
      [src]="text.photoDesktopUrl"
      [alt]="text.photoDesktopAlt"
      width="2400"
      height="1600"
      loading="lazy"
      decoding="async"
    />
  </picture>
  <p class="greeting__line anim-fade-up">{{ text.line }}</p>
  <p class="greeting__date anim-fade-up">{{ dateDisplay }}</p>
</section>
