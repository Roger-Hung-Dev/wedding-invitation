<title>V12 骨骼動作審看</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 版面：上方說明＋幕別分頁；主區左邊 3D 骨架播放器（16:9）＋時間軸，右邊「這幕用了哪些動畫」＋回饋（文字、Ctrl+V 貼圖、在畫面上圈） */
:root{
  --bg:#f6f4f7; --surface:#ffffff; --ink:#2b2530; --muted:#6d6474; --line:#e2dbe6;
  --accent:#9b5c7e; --accent-soft:#f3e6ee; --ok:#2f7d5b; --warn:#a6651c; --warn-soft:#f8ecdc; --bad:#b23b45;
  --stage:#eceff1; --grid:#c9ced3;
  --groom:#3f6fc4; --bride:#d0567f;
  --f-display:"Noto Serif TC","PMingLiU",serif; --f-body:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b171e; --surface:#251f29; --ink:#eee7f1; --muted:#a79cad; --line:#3a3140;
  --accent:#e0a3c4; --accent-soft:#3a2734; --ok:#7fd1a8; --warn:#f0b56b; --warn-soft:#3d2e1a; --bad:#f08b93;
  --stage:#20262b; --grid:#3a434b; --groom:#7fa6ee; --bride:#f08fb0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b171e; --surface:#251f29; --ink:#eee7f1; --muted:#a79cad; --line:#3a3140;
  --accent:#e0a3c4; --accent-soft:#3a2734; --ok:#7fd1a8; --warn:#f0b56b; --warn-soft:#3d2e1a; --bad:#f08b93;
  --stage:#20262b; --grid:#3a434b; --groom:#7fa6ee; --bride:#f08fb0; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(24px,3.6vw,32px)}
.lede{color:var(--muted);max-width:72ch;margin:6px 0 0}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.steps span{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.steps span.on{border-color:var(--accent);color:var(--accent);font-weight:700}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px}
nav.tabs button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
nav.tabs button:disabled{opacity:.5;cursor:default}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.player{display:grid;gap:10px;min-width:0}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:var(--stage);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#draw{cursor:crosshair;touch-action:none}
.hud{position:absolute;left:10px;top:8px;font-family:var(--f-mono);font-size:12px;color:var(--ink);background:color-mix(in srgb,var(--surface) 78%,transparent);padding:4px 8px;border-radius:6px;pointer-events:none;display:grid;gap:2px}
.hud b{font-weight:600}
.hud .g{color:var(--groom)} .hud .b{color:var(--bride)}
.drawbar{position:absolute;right:10px;top:8px;display:flex;gap:6px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctrl button,.views button,.tog label{font:inherit;font-size:13px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ctrl button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700;min-width:64px}
.ctrl button[aria-pressed="true"],.views button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.time{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:9.5em}
input[type=range]{flex:1 1 220px;accent-color:var(--accent)}
.lanes{display:grid;gap:4px;font-size:12px}
.lane{display:grid;grid-template-columns:3.2em 1fr;gap:6px;align-items:center}
.lane .who{font-weight:700}
.bar{position:relative;height:22px;background:var(--surface);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-right:1px solid var(--surface);font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;line-height:20px;font-size:11px;color:var(--surface)}
.bar .cur{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.views,.tog{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tog label{display:inline-flex;gap:6px;align-items:center}
.side{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card h3{font-family:var(--f-body);font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
td.t{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
td button{font:inherit;font-size:12px;padding:1px 8px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--accent);cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
textarea{width:100%;box-sizing:border-box;min-height:120px;font:inherit;font-size:15px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.paste{border:1.5px dashed var(--line);border-radius:8px;padding:12px;font-size:13px;color:var(--muted);text-align:center;outline:none}
.paste:focus,.paste.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.thumbs figure{margin:0;display:grid;gap:3px;position:relative}
.thumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--stage);cursor:zoom-in}
.thumbs figcaption{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.thumbs button{position:absolute;right:4px;top:4px;font:inherit;font-size:11px;padding:0 6px;border-radius:5px;border:0;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--bad);cursor:pointer}
.status{font-size:12.5px;color:var(--muted)}
.status.err{color:var(--bad)}
.note{font-size:13px;color:var(--muted)}
.btn{font:inherit;font-weight:700;font-size:14px;padding:7px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--surface);cursor:pointer;justify-self:start}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
dialog{border:0;border-radius:10px;padding:0;max-width:min(96vw,1400px);background:var(--surface)}
dialog img{display:block;max-width:100%;max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
</style>

<div class="wrap">
<header>
  <h1>V12 開場影片　骨骼動作審看</h1>
  <p class="lede">這一關只看<b>動作本身</b>：Mixamo 現成動畫原樣綁到新郎、新娘的骨架上，我只決定用哪一段、從第幾秒開始、站在哪裡。藍色是新郎、粉紅是新娘，半透明的圓錐是新娘蓬裙的範圍（腿或手跑出圓錐就是會穿出裙子）。</p>
  <div class="steps"><span class="on">第 1 關：骨骼動作</span><span>第 2 關：低畫質預覽</span><span>完整渲染</span></div>
</header>

<nav class="tabs" id="tabs" aria-label="選幕"></nav>

<section class="main">
  <div class="player">
    <div class="stage" id="stage">
      <canvas id="gl"></canvas>
      <canvas id="draw" hidden></canvas>
      <div class="hud" id="hud"></div>
      <div class="drawbar" id="drawbar" hidden>
        <button class="btn" id="drawAdd" type="button">加到回饋</button>
        <button class="btn ghost" id="drawClear" type="button">清掉</button>
        <button class="btn ghost" id="drawExit" type="button">取消</button>
      </div>
    </div>
    <div class="ctrl">
      <button class="primary" id="play" type="button">播放</button>
      <button id="prev" type="button" title="上一格">◀ 1 格</button>
      <button id="next" type="button" title="下一格">1 格 ▶</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="時間">
      <span class="time" id="time">0.00 / 0.00 秒</span>
    </div>
    <div class="ctrl" aria-label="播放速度">
      <span class="note">速度</span>
      <button data-speed="0.25" type="button">0.25×</button>
      <button data-speed="0.5" type="button">0.5×</button>
      <button data-speed="1" type="button" aria-pressed="true">1×</button>
      <span class="note" style="margin-left:8px">視角</span>
      <span class="views" id="views">
        <button data-view="cam" type="button" aria-pressed="true">影片鏡頭</button>
        <button data-view="front" type="button">正面</button>
        <button data-view="side" type="button">側面</button>
        <button data-view="top" type="button">俯視</button>
      </span>
    </div>
    <div class="lanes" id="lanes"></div>
    <div class="tog">
      <label><input type="checkbox" id="tSkirt" checked> 蓬裙範圍</label>
      <label><input type="checkbox" id="tProps" checked> 場景道具</label>
      <label><input type="checkbox" id="tTrail"> 腳步軌跡</label>
      <button class="btn ghost" id="drawBtn" type="button">在畫面上圈（暫停後圈出問題）</button>
    </div>
    <p class="note">拖曳畫面可以轉視角、滾輪縮放；選「影片鏡頭」回到正式影片的構圖。</p>
  </div>

  <div class="side">
    <div class="card">
      <h3 id="segTitle">這幕用了哪些 Mixamo 動畫</h3>
      <div class="tbl"><table id="segTable"></table></div>
      <p class="note" id="sceneNote"></p>
    </div>
    <div class="card" id="fbCard">
      <h3 id="fbTitle">回饋</h3>
      <textarea id="fbText" placeholder="例：3.2 秒新郎轉身太快／跳舞時新娘的手穿出裙子／可以"></textarea>
      <div class="paste" id="paste" tabindex="0">在這裡按 <b>Ctrl+V</b> 貼上截圖（可先在截圖上圈出問題），或把圖片拖進來</div>
      <div class="thumbs" id="thumbs"></div>
      <div class="status" id="status">載入中…</div>
    </div>
  </div>
</section>
<dialog id="zoom"><img alt="放大的回饋圖"></dialog>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
// 樣板（fast-iteration.md §0.5 第 1 關）：每支片改 <title>、ROUND、SCENES；每幕的骨架放 s<幕>/skeleton.json（mx_skeleton.py 產生）
const ROUND = 1;   // 第幾輪骨骼審看（寫進回饋 doc，主控端分辨新舊回饋）
const SCENES = [
  {id: "02", label: "② 跳舞", ready: true},
  {id: "03", label: "③ 地毯", ready: false},
  {id: "05", label: "⑤ 路人", ready: false},
  {id: "07", label: "⑦ 晚餐", ready: false},
  {id: "08", label: "⑧ 拱門", ready: false},
];
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const B2T = p => new THREE.Vector3(p[0], p[2], -p[1]);          // Blender（Z 朝上）→ three（Y 朝上）

// ── 3D ──
const canvas = $("#gl"), stage = $("#stage");
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene3 = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 16 / 9, 0.05, 200);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
scene3.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(-3, 6, 4); scene3.add(sun);
let grid = null;
const world = new THREE.Group(); scene3.add(world);

let S = null;           // 目前這一幕的資料
let chars = {};         // who → {lines, joints, head, skirt, facing, trail}
let tNow = 0, playing = false, speed = 1, view = "cam", lastTs = 0;

function themeColors() {
  scene3.background = new THREE.Color(css("--stage"));
  if (grid) world.remove(grid);
  grid = new THREE.GridHelper(16, 32, new THREE.Color(css("--grid")), new THREE.Color(css("--grid")));
  grid.material.opacity = 0.6; grid.material.transparent = true;
  world.add(grid);
  for (const [who, c] of Object.entries(chars)) {
    const col = new THREE.Color(css(who === "groom" ? "--groom" : "--bride"));
    c.lines.material.color = col; c.joints.material.color = col; c.head.material.color = col; c.facing.material.color = col;
    if (c.trail) c.trail.material.color = col;
  }
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeColors);
new MutationObserver(themeColors).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
  const d = $("#draw"); d.width = r.width * renderer.getPixelRatio(); d.height = r.height * renderer.getPixelRatio();
}
new ResizeObserver(resize).observe(stage);

function clearScene() {
  while (world.children.length) world.remove(world.children[0]);
  grid = null; chars = {};
}

function buildScene(data) {
  clearScene();
  S = data;
  const propGroup = new THREE.Group(); propGroup.name = "props"; world.add(propGroup);
  for (const p of data.props) {
    const mn = p.min, mx = p.max;
    const g = new THREE.BoxGeometry(mx[0] - mn[0], Math.max(0.004, mx[2] - mn[2]), mx[1] - mn[1]);
    const m = new THREE.MeshLambertMaterial({color: p.color, transparent: true, opacity: p.opacity != null ? p.opacity : 0.45, depthWrite: false});
    const b = new THREE.Mesh(g, m);
    b.position.copy(B2T([(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2]));
    propGroup.add(b);
  }
  for (const [who, c] of Object.entries(data.chars)) {
    const idx = Object.fromEntries(c.bones.map((n, i) => [n, i]));
    c.pidx = c.parents.map(p => p == null ? -1 : idx[p]);
    c.tidx = c.tips.map(n => idx[n]);
    const nSeg = c.bones.length - 1 + c.tips.length;
    const lg = new THREE.BufferGeometry(); lg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(nSeg * 6), 3));
    const lines = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({color: 0x000000}));
    const sg = new THREE.SphereGeometry(1, 10, 8);
    const joints = new THREE.InstancedMesh(sg, new THREE.MeshLambertMaterial({color: 0x000000}), c.bones.length);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.095, 20, 14), new THREE.MeshLambertMaterial({color: 0x000000, transparent: true, opacity: 0.55}));
    const facing = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.22, 3), new THREE.MeshBasicMaterial({color: 0x000000}));
    world.add(lines, joints, head, facing);
    let skirt = null;
    if (data.skirt && data.skirt.who === who) {
      const sk = data.skirt;
      skirt = new THREE.Mesh(new THREE.CylinderGeometry(sk.r_waist, sk.r_floor, sk.h_waist, 40, 1, true),
        new THREE.MeshBasicMaterial({color: new THREE.Color(css("--bride")), transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false}));
      world.add(skirt);
    }
    chars[who] = {data: c, lines, joints, head, facing, skirt, trail: null};
  }
  themeColors();
  $("#scrub").max = Math.round(data.dur * 1000);
  buildLanes(); buildSegTable(); setView(view); setTime(0);
}

function framePos(c, t) {
  const f = Math.max(0, Math.min(t * S.fps, c.frames.length - 1));
  const i = Math.min(Math.floor(f), c.frames.length - 2), a = f - i;
  const A = c.frames[i], Bf = c.frames[i + 1];
  const mix = (u, v) => [u[0] + (v[0] - u[0]) * a, u[1] + (v[1] - u[1]) * a, u[2] + (v[2] - u[2]) * a];
  return {p: A.p.map((u, k) => mix(u, Bf.p[k])), t: A.t.map((u, k) => mix(u, Bf.t[k])), label: c.labels[Math.round(f)]};
}

const tmpM = new THREE.Matrix4();
function update() {
  if (!S) return;
  const hud = [`<b>${tNow.toFixed(2)} 秒</b>`];
  for (const [who, ch] of Object.entries(chars)) {
    const c = ch.data, F = framePos(c, tNow);
    const P = F.p.map(B2T), T = F.t.map(B2T);
    const arr = ch.lines.geometry.attributes.position.array; let k = 0;
    for (let i = 0; i < P.length; i++) {
      const pi = c.pidx[i]; if (pi < 0) continue;
      arr.set([P[pi].x, P[pi].y, P[pi].z, P[i].x, P[i].y, P[i].z], k); k += 6;
    }
    c.tidx.forEach((bi, j) => { arr.set([P[bi].x, P[bi].y, P[bi].z, T[j].x, T[j].y, T[j].z], k); k += 6; });
    ch.lines.geometry.attributes.position.needsUpdate = true;
    ch.lines.geometry.computeBoundingSphere();
    P.forEach((v, i) => {
      const n = c.bones[i], r = /Thumb|Index|Middle|Ring|Little/.test(n) ? 0.007 : 0.018;
      tmpM.makeScale(r, r, r); tmpM.setPosition(v); ch.joints.setMatrixAt(i, tmpM);
    });
    ch.joints.instanceMatrix.needsUpdate = true;
    const hi = c.bones.indexOf("J_Bip_C_Head"), hj = c.tips.indexOf("J_Bip_C_Head");
    ch.head.position.copy(P[hi]).lerp(T[hj], 0.45);
    // 面向：左右髖關節 → 往前的箭頭（地上）
    const L = P[c.bones.indexOf("J_Bip_L_UpperLeg")], R = P[c.bones.indexOf("J_Bip_R_UpperLeg")];
    const hip = P[0], side = new THREE.Vector3().subVectors(L, R); side.y = 0; side.normalize();
    const fwd = new THREE.Vector3().crossVectors(side, new THREE.Vector3(0, 1, 0)).normalize();
    ch.facing.position.set(hip.x + fwd.x * 0.32, 0.02, hip.z + fwd.z * 0.32);
    ch.facing.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), fwd);
    if (ch.skirt) { const h = S.skirt.h_waist; ch.skirt.position.set(hip.x, h / 2, hip.z); ch.skirt.visible = $("#tSkirt").checked; }
    hud.push(`<span class="${who === "groom" ? "g" : "b"}">${who === "groom" ? "新郎" : "新娘"}：${F.label}</span>`);
  }
  const pg = world.getObjectByName("props"); if (pg) pg.visible = $("#tProps").checked;
  $("#hud").innerHTML = hud.join("");
  $("#time").textContent = `${tNow.toFixed(2)} / ${S.dur.toFixed(2)} 秒`;
  $("#scrub").value = Math.round(tNow * 1000);
  document.querySelectorAll(".bar .cur").forEach(el => el.style.left = (tNow / S.dur * 100) + "%");
}

function buildTrails() {
  for (const ch of Object.values(chars)) {
    if (ch.trail) { world.remove(ch.trail); ch.trail = null; }
    if (!$("#tTrail").checked) continue;
    const c = ch.data, pts = [];
    const fi = ["J_Bip_L_Foot", "J_Bip_R_Foot"].map(n => c.bones.indexOf(n));
    c.frames.forEach(fr => fi.forEach(i => pts.push(B2T(fr.p[i]))));
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    ch.trail = new THREE.Points(g, new THREE.PointsMaterial({size: 0.025, color: 0x000000}));
    world.add(ch.trail);
  }
  themeColors();
}

function setTime(t) { tNow = Math.max(0, Math.min(S ? S.dur : 0, t)); update(); }
function loop(ts) {
  if (playing && S) {
    const dt = lastTs ? (ts - lastTs) / 1000 : 0;
    tNow += dt * speed; if (tNow > S.dur) tNow = 0;
    update();
  }
  lastTs = ts;
  controls.update();
  renderer.render(scene3, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function setView(v) {
  view = v;
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  if (!S) return;
  const c = S.cam;
  const aim = B2T(c.aim);
  if (v === "cam") {
    camera.fov = 2 * Math.atan((c.sensor / c.aspect / 2) / c.lens) * 180 / Math.PI;
    camera.position.copy(B2T(c.pos)); controls.target.copy(aim);
  } else {
    camera.fov = 35;
    const tgt = B2T([c.aim[0], 0.9, 0.95]);
    controls.target.copy(tgt);
    if (v === "front") camera.position.copy(tgt.clone().add(new THREE.Vector3(0, 0.35, 6.2)));
    if (v === "side") camera.position.copy(tgt.clone().add(new THREE.Vector3(6.2, 0.35, 0)));
    if (v === "top") camera.position.copy(tgt.clone().add(new THREE.Vector3(0, 7.5, 0.01)));
  }
  camera.updateProjectionMatrix(); controls.update();
}

// ── 時間軸上的段落 ──
const PAL = ["#6b8fb8", "#8e7cb5", "#5f9b88", "#c4895c", "#b86b86", "#7c8a99", "#9aa35f"];
function buildLanes() {
  const el = $("#lanes"); el.innerHTML = "";
  for (const [who, ch] of Object.entries(chars)) {
    const row = document.createElement("div"); row.className = "lane";
    row.innerHTML = `<span class="who" style="color:var(--${who})">${who === "groom" ? "新郎" : "新娘"}</span><div class="bar"></div>`;
    const bar = row.querySelector(".bar");
    ch.data.segs.forEach((s, i) => {
      const next = ch.data.segs[i + 1], end = next ? next.start : s.start + s.dur;
      const it = document.createElement("i");
      it.style.left = (s.start / S.dur * 100) + "%"; it.style.width = (Math.max(0, Math.min(S.dur, end) - s.start) / S.dur * 100) + "%";
      it.style.background = PAL[i % PAL.length]; it.textContent = s.name.replace(/（.*$/, ""); it.title = s.name;
      bar.appendChild(it);
    });
    const cur = document.createElement("span"); cur.className = "cur"; bar.appendChild(cur);
    bar.addEventListener("click", e => { const r = bar.getBoundingClientRect(); setTime((e.clientX - r.left) / r.width * S.dur); });
    el.appendChild(row);
  }
}
function buildSegTable() {
  const tb = $("#segTable");
  tb.innerHTML = "<tr><th>角色</th><th>秒數</th><th>Mixamo 動畫</th><th></th></tr>";
  for (const [who, ch] of Object.entries(chars)) {
    ch.data.segs.forEach((s, i) => {
      const next = ch.data.segs[i + 1], end = Math.min(S.dur, next ? next.start : s.start + s.dur);
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><span class="dot" style="background:var(--${who})"></span>${who === "groom" ? "新郎" : "新娘"}</td><td class="t">${s.start.toFixed(1)}–${end.toFixed(1)}</td><td></td><td><button type="button">看</button></td>`;
      tr.children[2].textContent = s.name;
      tr.querySelector("button").addEventListener("click", () => { playing = false; $("#play").textContent = "播放"; setTime(s.start + 0.05); });
      tb.appendChild(tr);
    });
  }
  $("#segTitle").textContent = `這幕用了哪些 Mixamo 動畫（${S.title}）`;
  $("#sceneNote").textContent = "段與段之間有 0.3 秒漸變；跳舞與鞠躬固定面向鏡頭。動作本身沒有改。";
}

// ── 控制 ──
$("#play").addEventListener("click", () => { playing = !playing; $("#play").textContent = playing ? "暫停" : "播放"; if (playing && tNow >= S.dur - 0.01) tNow = 0; });
$("#prev").addEventListener("click", () => { playing = false; $("#play").textContent = "播放"; setTime(Math.round(tNow * S.fps - 1) / S.fps); });
$("#next").addEventListener("click", () => { playing = false; $("#play").textContent = "播放"; setTime(Math.round(tNow * S.fps + 1) / S.fps); });
$("#scrub").addEventListener("input", e => { setTime(e.target.value / 1000); });
document.querySelectorAll("[data-speed]").forEach(b => b.addEventListener("click", () => {
  speed = parseFloat(b.dataset.speed);
  document.querySelectorAll("[data-speed]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
}));
document.querySelectorAll("#views button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
["#tSkirt", "#tProps"].forEach(s => $(s).addEventListener("change", update));
$("#tTrail").addEventListener("change", buildTrails);
controls.addEventListener("start", () => { if (view !== "free") { view = "free"; document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", "false")); } });
document.addEventListener("keydown", e => {
  if (e.target.closest("textarea,input")) return;
  if (e.code === "Space") { e.preventDefault(); $("#play").click(); }
  if (e.key === "ArrowLeft") $("#prev").click();
  if (e.key === "ArrowRight") $("#next").click();
});

// ── 分頁 ──
let current = null;
function buildTabs() {
  const nav = $("#tabs"); nav.innerHTML = "";
  SCENES.forEach(s => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = s.ready ? s.label : s.label + "（製作中）";
    b.disabled = !s.ready; b.setAttribute("aria-selected", String(s.id === current));
    b.addEventListener("click", () => openScene(s.id));
    nav.appendChild(b);
  });
}
async function openScene(id) {
  current = id; buildTabs();
  try { location.hash = "s" + id; } catch (e) {}
  const r = await fetch(`s${id}/skeleton.json`);
  buildScene(await r.json());
  loadFeedback(id);
}

// ── 回饋（db＋assets；沒有時退回本機草稿） ──
let db = null, assets = null, fb = {text: "", images: []}, saveTimer = null, unsub = null;
const status = (msg, err) => { const s = $("#status"); s.textContent = msg; s.classList.toggle("err", !!err); };
const lsKey = id => "v12skel_draft_" + id;
function renderThumbs() {
  const el = $("#thumbs"); el.innerHTML = "";
  fb.images.forEach((im, i) => {
    const f = document.createElement("figure");
    const src = im.local || ("/_blob/" + im.id);
    f.innerHTML = `<img alt="回饋圖 ${i + 1}"><figcaption></figcaption><button type="button" title="拿掉這張">✕</button>`;
    f.querySelector("img").src = src;
    f.querySelector("figcaption").textContent = `#${i + 1}｜${im.t != null ? im.t.toFixed(2) + " 秒" : ""}${im.kind === "draw" ? "｜畫面圈選" : "｜貼上"}`;
    f.querySelector("img").addEventListener("click", () => { const d = $("#zoom"); d.querySelector("img").src = src; d.showModal(); });
    f.querySelector("button").addEventListener("click", () => { fb.images.splice(i, 1); renderThumbs(); queueSave(); });
    el.appendChild(f);
  });
}
$("#zoom").addEventListener("click", () => $("#zoom").close());
function queueSave() { clearTimeout(saveTimer); status("尚未儲存…"); saveTimer = setTimeout(save, 900); }
async function save() {
  const id = current, body = {scene: id, stage: "skeleton", round: ROUND, text: fb.text, images: fb.images.filter(x => x.id).map(({id, t, kind}) => ({id, t, kind})), updatedAt: new Date().toISOString()};
  try { localStorage.setItem(lsKey(id), JSON.stringify({text: fb.text})); } catch (e) {}
  if (!db) { status("這個檢視無法同步，只存在你這台電腦的瀏覽器。文字可以複製貼回對話。"); return; }
  try { await db.doc(`review/skel-${id}`).set(body); status("已儲存（Claude 讀得到）"); }
  catch (e) { status(e && e.code === "invalid_argument" ? "你沒有寫入權限，只能看。" : "儲存失敗，稍後會再試。", true); if (e && e.code === "unavailable") setTimeout(save, 1500); }
}
function loadFeedback(id) {
  fb = {text: "", images: []};
  try { const d = JSON.parse(localStorage.getItem(lsKey(id)) || "null"); if (d) fb.text = d.text || ""; } catch (e) {}
  $("#fbText").value = fb.text; renderThumbs();
  $("#fbTitle").textContent = `第 ${parseInt(id, 10)} 幕回饋`;
  if (unsub) { unsub(); unsub = null; }
  if (!db) { status(assets === null ? "在 claude.ai 開這頁才能同步回饋與貼圖。" : "載入中…"); return; }
  let first = true;
  unsub = db.doc(`review/skel-${id}`).onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    const d = snap.exists ? snap.data() : null;
    if (first || document.activeElement !== $("#fbText")) {
      if (d) { fb.text = d.text || ""; $("#fbText").value = fb.text; }
    }
    if (d) { fb.images = (d.images || []).map(x => ({...x})); renderThumbs(); }
    status(d ? `已儲存（${new Date(d.updatedAt).toLocaleString("zh-TW")}）` : "還沒有回饋");
    first = false;
  }, e => status("同步中斷，重新整理頁面即可。", true));
}
$("#fbText").addEventListener("input", e => { fb.text = e.target.value; queueSave(); });

async function addImage(blob, kind) {
  const t = tNow;
  if (!assets) { status("這個檢視不能存圖片（要在 claude.ai 用你的帳號開）。", true); return; }
  const local = URL.createObjectURL(blob);
  const item = {local, t, kind}; fb.images.push(item); renderThumbs(); status("上傳圖片中…");
  try {
    const type = /^image\/(png|jpeg|gif|webp)$/.test(blob.type) ? blob.type : "image/png";
    const r = await assets.upload(blob, {type});
    item.id = r.id; delete item.local; renderThumbs(); await save();
  } catch (e) {
    fb.images = fb.images.filter(x => x !== item); renderThumbs();
    status(e && e.code === "too_large" ? "圖片太大（上限 20 MB）。" : e && e.code === "rate_limited" ? "貼太快了，等幾秒再貼。" : "圖片上傳失敗。", true);
  }
}
const pz = $("#paste");
document.addEventListener("paste", e => {
  const items = [...(e.clipboardData ? e.clipboardData.items : [])].filter(i => i.type.startsWith("image/"));
  if (!items.length) return;
  e.preventDefault(); items.forEach(i => addImage(i.getAsFile(), "paste"));
});
pz.addEventListener("dragover", e => { e.preventDefault(); pz.classList.add("hot"); });
pz.addEventListener("dragleave", () => pz.classList.remove("hot"));
pz.addEventListener("drop", e => { e.preventDefault(); pz.classList.remove("hot"); [...e.dataTransfer.files].filter(f => f.type.startsWith("image/")).forEach(f => addImage(f, "paste")); });

// ── 在畫面上圈 ──
const dc = $("#draw"), dctx = dc.getContext("2d"); let drawing = false;
function drawMode(on) {
  dc.hidden = !on; $("#drawbar").hidden = !on; controls.enabled = !on;
  if (on) { playing = false; $("#play").textContent = "播放"; dctx.clearRect(0, 0, dc.width, dc.height); }
}
$("#drawBtn").addEventListener("click", () => drawMode(true));
$("#drawExit").addEventListener("click", () => drawMode(false));
$("#drawClear").addEventListener("click", () => dctx.clearRect(0, 0, dc.width, dc.height));
const dpos = e => { const r = dc.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * dc.width, (e.clientY - r.top) / r.height * dc.height]; };
dc.addEventListener("pointerdown", e => { drawing = true; dc.setPointerCapture(e.pointerId); const [x, y] = dpos(e); dctx.beginPath(); dctx.moveTo(x, y); dctx.strokeStyle = "#e0242f"; dctx.lineWidth = 4 * renderer.getPixelRatio(); dctx.lineCap = "round"; dctx.lineJoin = "round"; });
dc.addEventListener("pointermove", e => { if (!drawing) return; const [x, y] = dpos(e); dctx.lineTo(x, y); dctx.stroke(); });
dc.addEventListener("pointerup", () => { drawing = false; });
$("#drawAdd").addEventListener("click", () => {
  renderer.render(scene3, camera);
  const out = document.createElement("canvas"); out.width = canvas.width; out.height = canvas.height;
  const o = out.getContext("2d"); o.drawImage(canvas, 0, 0); o.drawImage(dc, 0, 0, out.width, out.height);
  o.font = `${16 * renderer.getPixelRatio()}px monospace`; o.fillStyle = "#e0242f"; o.fillText(`${S.title}  ${tNow.toFixed(2)} 秒`, 12, out.height - 12);
  out.toBlob(b => { if (b) addImage(b, "draw"); drawMode(false); }, "image/png");
});

// ── 啟動 ──
(async () => {
  buildTabs();
  const want = (location.hash || "").replace("#s", "");
  openScene(SCENES.some(s => s.id === want && s.ready) ? want : (SCENES.find(s => s.ready) || SCENES[0]).id);
  if (window.claude && claude.use) {
    try { db = await claude.use("db"); } catch (e) { db = null; }
    try { assets = await claude.use("assets"); } catch (e) { assets = null; }
  }
  if (!assets) { pz.textContent = "這個檢視不能貼圖（要在 claude.ai 用你的帳號開）"; }
  if (current) loadFeedback(current);
})();
})();
</script>
