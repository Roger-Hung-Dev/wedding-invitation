<title id="t">臻愛花園飯店停車資訊（捷運路線圖版）</title>
<desc id="d">以路線圖表示：沿高鐵路三段往北，先經過高鐵五路口、再到機車入口、最後是汽車入口，兩個入口都通往飯店停車場，停車後步行到接待大廳搭電梯上 2F 東方明珠。</desc>
