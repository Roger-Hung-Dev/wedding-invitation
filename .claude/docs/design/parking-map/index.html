<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>停車示意圖比稿</title>
<style>
  :root { --bg:#FDF2F8; --ink:#831843; --muted:#7A5560; --card:#fff; --line:#F0D9E2; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; }
  header { padding:32px 16px 8px; text-align:center; }
  h1 { font-family:'Noto Serif TC',serif; margin:0 0 8px; font-size:28px; }
  header p { margin:0; color:var(--muted); font-size:15px; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr)); gap:24px; padding:24px 16px 48px; max-width:1680px; margin:0 auto; }
  .card { margin:0; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .card a { display:block; background:#faf7f5; }
  .card img { display:block; width:100%; height:auto; max-height:760px; object-fit:contain; }
  figcaption { padding:14px 16px 18px; display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--line); }
  figcaption b { font-size:17px; }
  figcaption span { color:var(--muted); font-size:14px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1>停車示意圖　10 版比稿</h1>
  <p>點圖可開原尺寸 SVG。所有版本內容相同，差別在呈現方式。</p>
</header>
<main>
    <figure class="card">
      <a href="v01.svg" target="_blank"><img src="v01.svg" alt="喜帖雅緻版" loading="lazy"></a>
      <figcaption><b>V01　喜帖雅緻版</b><span>沿用喜帖網站的酒紅、玫瑰粉與燙金色票，停車場用最深的酒紅標出，放進網站不會跳色。</span></figcaption>
    </figure>
    <figure class="card">
      <a href="v02.svg" target="_blank"><img src="v02.svg" alt="極簡扁平版" loading="lazy"></a>
      <figcaption><b>V02　極簡扁平版</b><span>全圖只有灰階加兩個顏色：藍＝汽車與停車場、橘＝機車。資訊最少、最不花俏。</span></figcaption>
    </figure>
    <figure class="card">
      <a href="v03.svg" target="_blank"><img src="v03.svg" alt="周邊路網版（北方朝上）" loading="lazy"></a>
      <figcaption><b>V03　周邊路網版（北方朝上）</b><span>北方朝上、方位與 Google 地圖一致。畫出南下／北上兩條開車路線，以及高鐵站走過來的步行路線。</span></figcaption>
    </figure>
    <figure class="card">
      <a href="v04.svg" target="_blank"><img src="v04.svg" alt="立體鳥瞰版" loading="lazy"></a>
      <figcaption><b>V04　立體鳥瞰版</b><span>斜俯視的立體模型：建物有高度、停車場停滿車，入口用浮在空中的大頭針標示，最有「現場感」。</span></figcaption>
    </figure>
    <figure class="card">
      <a href="v05.svg" target="_blank"><img src="v05.svg" alt="三步驟圖卡版" loading="lazy"></a>
      <figcaption><b>V05　三步驟圖卡版</b><span>手機直式。把「開到哪、從哪進、停好後怎麼走」拆成三格，每格只畫那一步需要的東西。</span></figcaption>
    </figure>
    <figure class="card">
      <a href="v06.svg" target="_blank"><img src="v06.svg" alt="汽機車分流版" loading="lazy"></a>
      <figcaption><b>V06　汽機車分流版</b><span>汽車一張圖、機車一張圖，各自只亮自己的路線；另一個入口打叉，提醒不要轉錯。</span></figcaption>
    </figure>
    <figure class="card">
      <a href="v07.svg" target="_blank"><img src="v07.svg" alt="捷運路線圖版" loading="lazy"></a>
      <figcaption><b>V07　捷運路線圖版</b><span>不畫地形，把高鐵路三段當成一條主線、入口與大廳當成站點，只回答「依序經過什麼、在哪轉」。</span></figcaption>
    </figure>
    <figure class="card">
      <a href="v08.svg" target="_blank"><img src="v08.svg" alt="夜間版" loading="lazy"></a>
      <figcaption><b>V08　夜間版</b><span>晚宴 18:00 入席、12 月天黑得早，賓客抵達時是晚上。深色底配發光的入口與停車場外框，跟開場畫面的夜色同調。</span></figcaption>
    </figure>
    <figure class="card">
      <a href="v09.svg" target="_blank"><img src="v09.svg" alt="手繪插畫版" loading="lazy"></a>
      <figcaption><b>V09　手繪插畫版</b><span>水彩色塊加抖動線條與手寫註解，像新人親手畫給朋友的小地圖，最有人味。</span></figcaption>
    </figure>
    <figure class="card">
      <a href="v10.svg" target="_blank"><img src="v10.svg" alt="手機直式資訊卡版" loading="lazy"></a>
      <figcaption><b>V10　手機直式資訊卡版</b><span>1080×1920 直式（LINE／限時動態比例）。上半張圖、下半五列大字重點，存成圖片就能直接轉傳給長輩。</span></figcaption>
    </figure>
</main>
</body>
</html>
